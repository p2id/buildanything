name: Validate release metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run manifest generator tests
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate release manifest and checksums
        run: python3 automation/update_manifest.py
      - name: Ensure release metadata is current
        run: git diff --exit-code -- MANIFEST.json SHA256SUMS.txt
      - name: Validate core JSON
        run: |
          python3 -m json.tool MANIFEST.json >/dev/null
          python3 -m json.tool data/workflow.schema.json >/dev/null
          python3 -m json.tool data/workflow.json >/dev/null
          python3 -m json.tool automation/make-blueprint.json >/dev/null
          python3 -m json.tool automation/n8n-workflow.json >/dev/null
      - name: Verify required source files
        run: test -s docs/00-overview.md && test -s data/workflow.schema.json
